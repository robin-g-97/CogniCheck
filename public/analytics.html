<!DOCTYPE HTML>
<html>
<head>
    <script src="/js/shared/nav.js" defer></script>
    <script src="/js/analytics-page.js" defer></script>

    <title>CogniCheck Analytics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
<div id="nav"></div>

<main class="analytics-page">
    <section class="analytics-header">
        <h1>CogniCheck Analytics</h1>
        <p>PostgreSQL-backed stats for page views, analysis activity and LLM outputs.</p>
    </section>

    <p id="database-status" class="analytics-status"></p>

    <section class="analytics-grid">
        <article class="analytics-card">
            <span class="analytics-label">Page views</span>
            <strong id="page-view-total">-</strong>
        </article>
        <article class="analytics-card">
            <span class="analytics-label">Unique viewers</span>
            <strong id="unique-viewer-total">-</strong>
        </article>
        <article class="analytics-card">
            <span class="analytics-label">Successful analysis events</span>
            <strong id="analysis-success-total">-</strong>
        </article>
        <article class="analytics-card">
            <span class="analytics-label">Stored outputs</span>
            <strong id="output-total">-</strong>
        </article>
    </section>

    <section class="analytics-section">
        <h2>Activity Breakdown</h2>
        <div id="analytics-breakdown" class="analytics-breakdown"></div>
    </section>

    <section class="analytics-section">
        <h2>Latest LLM Outputs</h2>
        <div id="output-log-list" class="prompt-log-list"></div>
    </section>
</main>

</body>
</html>
